name: WORLD public layers validation

on:
  pull_request:
    paths:
      - 'src/middleware.ts'
      - 'src/middleware.test.ts'
      - 'src/app/page.tsx'
      - 'src/components/WorldMap.tsx'
      - 'src/app/globals.css'
      - 'src/lib/appNewsPins*'
      - 'src/app/api/news/route.ts'
      - 'public/data/ne110-land-boundaries.geojson'
      - 'src/components/LayerPanel.tsx'
      - 'src/lib/publicLayerData*'
      - 'src/lib/publicReferenceAtlas*'
      - 'src/lib/publicGeometryBoundary*'
      - 'src/lib/publicCountryVisibility*'
      - 'src/lib/iswnAtlas*'
      - 'src/app/api/reference-atlas/**'
      - 'src/components/PriorityNewsCards*'
      - 'src/components/LiveAlerts*'
      - 'src/lib/priorityNews*'
      - 'src/lib/publishedMapPresentation*'
      - 'src/lib/map-symbols*'
      - 'src/lib/layerUrlState*'
      - 'src/lib/publicEmbedView*'
      - 'src/lib/yemenMapView*'
      - 'tools/preview-smoke.mjs'
      - 'src/lib/publicRefreshPolicy*'
      - 'docs/ISWN_REFERENCE_MAP_CONTRACT_2026-10-15.md'
      - 'tools/refresh-reference-atlas.mjs'
      - '.github/workflows/reference-atlas-refresh.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/publicFieldAlerts*'
      - 'src/lib/publicMilitarySatelliteActivity*'
      - 'src/app/api/flights/route.ts'
      - 'src/app/api/satellites/route.ts'
      - 'src/lib/map-terrain*'
      - 'src/lib/terrain-source-attribution*'
      - 'src/lib/etopo-relief*'
      - 'src/app/terrain-sources/page.tsx'
      - 'src/app/api/cctv/**'
      - 'src/app/api/geosearch/route.ts'
      - 'src/components/SearchBar.tsx'
      - 'src/app/api/region-dossier/**'
      - 'src/lib/satellite-layer*'
      - 'src/lib/menaSignals*'
      - 'src/lib/gdeltCoverageLedger*'
      - 'src/lib/gdeltPublicHistory*'
      - 'src/app/api/gdelt-history/**'
      - 'supabase/functions/world-gdelt-archive/**'
      - 'infra/supabase_applied/**'
      - 'docs/WORLD_GDELT_DURABLE_ARCHIVE_2026-10-05.md'
      - 'tools/verify-world-archive.mjs'
      - 'src/app/api/gdelt-events/**'
      - 'src/app/api/source-coverage/**'
      - 'src/components/MenaPulse.tsx'
      - 'docs/M3TM_FUSION_RADAR_2026.md'
      # ACLED/conflict and handoff/source provenance changes require full checks.
      - 'src/lib/acled*'
      - 'src/app/api/conflicts/**'
      - 'src/app/api/health/**'
      - 'docs/ACLED_PUBLIC_SOURCE_CONTRACT_2026-10-04.md'
      - 'docs/M3TM_CONTINUATION_MASTER_2026-10-04.md'
      - 'docs/M3TM_PROJECTS_INTEGRATION_2026.md'
      - 'AGENTS.md'
      # Browser, search-engine and install icons are production assets.
      - 'src/app/layout.tsx'
      - 'src/app/favicon.ico'
      - 'public/favicon*'
      - 'public/m3tm-mark.png'
      - 'public/site.webmanifest'
      - 'public/manifest.json'
      - 'tsconfig.json'
      - 'vercel.json'
      - '.github/workflows/world-public-layers.yml'
      - '.github/workflows/world-live-source-smoke.yml'
  workflow_dispatch:

concurrency:
  group: world-public-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-world:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit --incremental false
      - run: npm test
      - run: npm run build
      - name: Capture Yemen published map regression
        shell: bash
        run: |
          node node_modules/next/dist/bin/next start -p 5194 > /tmp/world-yemen.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5194/ > /dev/null; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome)"
          export PREVIEW_URL='http://127.0.0.1:5194/?surface=public&layers=reference_atlas,frontlines,gdelt_events,app_news,alert_pins,country_borders&layers_v=5'
          export SMOKE_SCENARIO=yemen
          export SMOKE_OUTPUT_DIR=visual-yemen
          node tools/preview-smoke.mjs
      - name: Upload Yemen map proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-yemen-map-proof
          path: visual-yemen/*
          retention-days: 3
      # Typecheck the deployed Supabase Edge worker independently from Next.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/world-gdelt-archive/deno.json supabase/functions/world-gdelt-archive/index.ts
      # Offline migration privilege contract review; does not contact APP DB.
      - run: node tools/verify-world-archive.mjs
