name: WORLD public layers validation

on:
  pull_request:
    paths:
      - 'src/app/page.tsx'
      - 'src/components/WorldMap.tsx'
      - 'src/lib/appNewsPins*'
      - 'src/app/api/news/route.ts'
      - 'public/data/ne110-land-boundaries.geojson'
      - 'src/components/LayerPanel.tsx'
      - 'src/lib/publicLayerData*'
      - 'src/app/api/cctv/**'
      - '.github/workflows/world-public-layers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-world:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit --incremental false
      - run: npm test
      - run: npm run build
