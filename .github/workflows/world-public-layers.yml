name: WORLD public layers validation

on:
  pull_request:
    paths:
      - 'src/app/page.tsx'
      - 'src/components/WorldMap.tsx'
      - 'src/app/globals.css'
      - 'src/lib/appNewsPins*'
      - 'src/app/api/news/route.ts'
      - 'public/data/ne110-land-boundaries.geojson'
      - 'src/components/LayerPanel.tsx'
      - 'src/lib/publicLayerData*'
      - 'src/lib/publicFieldAlerts*'
      - 'src/lib/publicMilitarySatelliteActivity*'
      - 'src/app/api/flights/route.ts'
      - 'src/app/api/satellites/route.ts'
      - 'src/lib/map-terrain*'
      - 'src/lib/terrain-source-attribution*'
      - 'src/lib/etopo-relief*'
      - 'src/app/terrain-sources/page.tsx'
      - 'src/app/api/cctv/**'
      - 'src/app/api/geosearch/route.ts'
      - 'src/components/SearchBar.tsx'
      - 'src/app/api/region-dossier/**'
      - 'src/lib/satellite-layer*'
      - 'src/lib/menaSignals*'
      - 'src/lib/gdeltCoverageLedger*'
      - 'src/lib/gdeltPublicHistory*'
      - 'src/lib/conflictEvolution*'
      - 'src/app/conflict-evolution/**'
      - 'src/app/api/gdelt-history/**'
      - 'supabase/functions/world-gdelt-archive/**'
      - 'infra/supabase_applied/**'
      - 'docs/WORLD_GDELT_DURABLE_ARCHIVE_2026-10-05.md'
      - 'tools/verify-world-archive.mjs'
      - 'src/app/api/gdelt-events/**'
      - 'src/app/api/source-coverage/**'
      - 'src/components/MenaPulse.tsx'
      - 'docs/M3TM_FUSION_RADAR_2026.md'
      # ACLED/conflict and handoff/source provenance changes require full checks.
      - 'src/lib/acled*'
      - 'src/app/api/conflicts/**'
      - 'src/app/api/health/**'
      - 'docs/ACLED_PUBLIC_SOURCE_CONTRACT_2026-10-04.md'
      - 'docs/M3TM_CONTINUATION_MASTER_2026-10-04.md'
      - 'docs/M3TM_PROJECTS_INTEGRATION_2026.md'
      - 'AGENTS.md'
      # Browser, search-engine and install icons are production assets.
      - 'src/app/layout.tsx'
      - 'src/app/favicon.ico'
      - 'public/favicon*'
      - 'public/m3tm-mark.png'
      - 'public/site.webmanifest'
      - 'public/manifest.json'
      - 'tsconfig.json'
      - 'vercel.json'
      - '.github/workflows/world-public-layers.yml'
  workflow_dispatch:

concurrency:
  group: world-public-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-world:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit --incremental false
      - run: npm test
      - run: npm run build
      # Typecheck the deployed Supabase Edge worker independently from Next.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/world-gdelt-archive/deno.json supabase/functions/world-gdelt-archive/index.ts
      # Offline migration privilege contract review; does not contact APP DB.
      - run: node tools/verify-world-archive.mjs
