name: Temporary provider credential audit

on:
  push:
    branches:
      - fix/provider-state-final-closure-20261003

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      HAS_VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN != '' }}
      HAS_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID != '' }}
      HAS_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID != '' }}
      HAS_GH_AIS: ${{ secrets.AIS_API_KEY != '' }}
      HAS_GH_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_GH_UPSTASH_URL: ${{ secrets.UPSTASH_REDIS_REST_URL != '' }}
      HAS_GH_UPSTASH_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN != '' }}
      HAS_GH_KV_URL: ${{ secrets.KV_REST_API_URL != '' }}
      HAS_GH_KV_TOKEN: ${{ secrets.KV_REST_API_TOKEN != '' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Report GitHub secret presence only
        shell: bash
        run: |
          echo "github_secrets:"
          echo "  VERCEL_TOKEN_present=$HAS_VERCEL_TOKEN"
          echo "  VERCEL_OIDC_TOKEN_present=$HAS_VERCEL_OIDC_TOKEN"
          echo "  VERCEL_PROJECT_ID_present=$HAS_VERCEL_PROJECT_ID"
          echo "  VERCEL_ORG_ID_present=$HAS_VERCEL_ORG_ID"
          echo "  AIS_API_KEY_present=$HAS_GH_AIS"
          echo "  CLOUDFLARE_API_TOKEN_present=$HAS_GH_CF"
          echo "  UPSTASH_REDIS_REST_pair_present=$([[ "$HAS_GH_UPSTASH_URL" == "true" && "$HAS_GH_UPSTASH_TOKEN" == "true" ]] && echo true || echo false)"
          echo "  KV_REST_API_pair_present=$([[ "$HAS_GH_KV_URL" == "true" && "$HAS_GH_KV_TOKEN" == "true" ]] && echo true || echo false)"

      - name: Inspect linked Vercel environment presence only
        if: env.HAS_VERCEL_TOKEN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest link --yes --project m3tm-world --scope m3-tm --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@latest env pull /tmp/prod.env --yes --environment=production --scope m3-tm --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@latest env pull /tmp/preview.env --yes --environment=preview --scope m3-tm --token "$VERCEL_TOKEN" >/dev/null
          node <<'NODE'
          const fs = require('fs');
          const names = [
            'AIS_API_KEY','CLOUDFLARE_API_TOKEN',
            'UPSTASH_REDIS_REST_URL','UPSTASH_REDIS_REST_TOKEN',
            'KV_REST_API_URL','KV_REST_API_TOKEN',
            'OPENSKY_CLIENT_ID','OPENSKY_CLIENT_SECRET'
          ];
          function parse(path) {
            const text = fs.readFileSync(path,'utf8');
            const map = new Map();
            for (const line of text.split(/\r?\n/)) {
              if (!line || line.startsWith('#')) continue;
              const i=line.indexOf('=');
              if (i<1) continue;
              const k=line.slice(0,i);
              let v=line.slice(i+1).trim();
              if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) v=v.slice(1,-1);
              map.set(k,v);
            }
            return Object.fromEntries(names.map(k=>[k,{present:map.has(k),non_empty:Boolean(map.get(k))}]));
          }
          console.log('vercel_production_presence='+JSON.stringify(parse('/tmp/prod.env')));
          console.log('vercel_preview_presence='+JSON.stringify(parse('/tmp/preview.env')));
          NODE
          rm -f /tmp/prod.env /tmp/preview.env

      - name: Note Vercel inspection unavailable without token
        if: env.HAS_VERCEL_TOKEN != 'true'
        run: echo "vercel_secret_store_inspection=unavailable_no_GitHub_VERCEL_TOKEN"
