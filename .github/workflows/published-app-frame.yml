name: Verify published APP and WORLD browser acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/published-app-frame.yml'
      - 'tools/preview-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-browser:
    # Read-only acceptance against real published APP and WORLD, not fixtures.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      # The public Render instance is small: test one real client at a time.
      # Parallel browser probes previously caused false iframe startup misses.
      # Dedicated load tests must measure multi-client behavior separately.
      max-parallel: 1
      matrix:
        include:
          - id: app-desktop
            url: https://m3tm.app/
            scenario: app-frame
            mobile: '0'
          - id: app-mobile
            url: https://m3tm.app/
            scenario: app-frame
            mobile: '1'
          - id: world-desktop
            url: https://m3tm-world-recovery.onrender.com/
            scenario: world-live
            mobile: '0'
          - id: world-mobile
            url: https://m3tm-world-recovery.onrender.com/
            scenario: world-live
            mobile: '1'
          - id: world-embed
            url: https://m3tm-world-recovery.onrender.com/?embed=1&surface=public
            scenario: world-live
            mobile: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real Chromium production checks
        env:
          PREVIEW_URL: ${{ matrix.url }}
          SMOKE_SCENARIO: ${{ matrix.scenario }}
          SMOKE_MOBILE: ${{ matrix.mobile }}
          SMOKE_OUTPUT_DIR: published-proof
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          node tools/preview-smoke.mjs
      - name: Preserve browser screenshots and check ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-browser-${{ matrix.id }}
          path: published-proof/*
          if-no-files-found: warn
          retention-days: 5
