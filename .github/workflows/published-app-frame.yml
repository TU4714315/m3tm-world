name: Verify published APP iframe

on:
  pull_request:
    paths:
      - '.github/workflows/published-app-frame.yml'
      - 'tools/preview-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-frame:
    # Observes the deployed APP/WORLD pair; never substitutes for candidate CI.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live map handshake and published news
        env:
          PREVIEW_URL: https://m3tm.app/
          SMOKE_SCENARIO: app-frame
          SMOKE_OUTPUT_DIR: published-app-proof
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          node tools/preview-smoke.mjs
      - name: Preserve public screenshot and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-app-frame-proof
          path: published-app-proof/*
          retention-days: 3
