name: Watch public OSIRIS upstream parity

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report-upstream-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sourceOwner = 'simplifaisoul';
            const sourceRepo = 'osiris';
            const baseline = 'd972d9af5c6f45aebf6d60b8a60f229a8abbe2f1';
            const issue_number = 24;
            const upstream = await github.rest.repos.getBranch({
              owner: sourceOwner, repo: sourceRepo, branch: 'master',
            });
            const head = upstream.data.commit.sha;
            if (head === baseline) {
              core.summary.addRaw('No new upstream commits since reviewed baseline.').write();
              return;
            }
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner: sourceOwner, repo: sourceRepo,
              basehead: baseline + '...' + head, per_page: 100,
            });
            const files = comparison.data.files || [];
            const publicPaths = /^(src\/(app\/(api\/(cctv|conflicts|frontlines|flights|news)|page\.tsx)|components\/(LayerPanel|OsirisMap|LiveAlerts)|lib\/(alert-places|telegram|gdelt))|README\.md|DOCKER\.md)/;
            const relevant = files.filter(file => publicPaths.test(file.filename))
              .map(file => '- ' + file.status + ': `' + file.filename + '`');
            await core.summary.addRaw(
              'Upstream head: ' + head + '\nRelevant changed files: ' + relevant.length + '\n' + relevant.join('\n')
            ).write();
            if (!relevant.length) return;
            const marker = '<!-- m3tm-upstream-head:' + head + ' -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number, per_page: 100,
            });
            if (comments.some(c => c.body && c.body.includes(marker))) return;
            const warning = files.length >= 100
              ? '\nComparison response may be truncated; inspect the full upstream diff.'
              : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number,
              body: marker + '\nNew public-facing changes in reviewed OSIRIS upstream '
                + '(not automatically merged):\n\n' + relevant.join('\n')
                + warning + '\n\nReview source licensing, actual provider availability, '
                + 'data provenance, public/internal security boundary, CI and preview QA before porting.',
            });
