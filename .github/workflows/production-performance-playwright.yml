name: Chromium Playwright production latency benchmark
# QA read-only: APP Pages 1a0485f + WORLD Render f55b794; run after browser acceptance.
on:
  pull_request:
    paths:
      - '.github/workflows/production-performance-playwright.yml'
      - 'tools/production-performance-playwright.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      # Read-only post-#152 live benchmark: WORLD 980f459, APP 1a0485f. QA only, no deploy.
      # Do not saturate the one-instance Render Free service with 3 concurrent
      # 3-iteration cold benchmark workloads; keep each scenario isolated.
      max-parallel: 1
      matrix:
        scenario: [world-desktop, world-mobile, app-iframe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright CDP driver
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.58.2
      - name: Run 3 cold Chromium production iterations
        env:
          BENCH_SCENARIO: ${{ matrix.scenario }}
          BENCH_RUNS: '3'
          BENCH_OUTPUT: production-proof
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          node tools/production-performance-playwright.mjs
      - name: Retain per-iteration measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-latency-${{ matrix.scenario }}
          path: production-proof/*
          if-no-files-found: warn
          retention-days: 7
