name: Refresh published reference atlas

on:
  schedule:
    # Lightweight checks discover recent major publisher reports. The server
    # downloads the full map when its five-minute cache is due or for a qualifying report.
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      major_event_id:
        description: 'Optional stable event id for a verified major published update; reuse the id on retries'
        required: false
        type: string
  repository_dispatch:
    types: [major_published_event]

permissions:
  contents: read

concurrency:
  group: published-reference-atlas
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source cadence and refresh due snapshots
        env:
          WORLD_MAP_REFRESH_TOKEN: ${{ secrets.WORLD_MAP_REFRESH_TOKEN }}
          REFERENCE_ATLAS_ORIGIN: ${{ vars.REFERENCE_ATLAS_ORIGIN || 'https://m3tm-world-recovery.onrender.com' }}
          # Dispatch data stays in environment values, never interpolated into shell code.
          REFERENCE_ATLAS_TRIGGER: ${{ github.event_name }}
          REFERENCE_ATLAS_MAJOR_EVENT_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.event_id || inputs.major_event_id || '' }}
        run: node tools/refresh-reference-atlas.mjs
