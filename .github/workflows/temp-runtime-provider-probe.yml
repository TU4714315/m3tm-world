name: Temporary runtime provider probe

on:
  push:
    branches:
      - fix/provider-probe-state-final-20261003

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe Production and Preview health without secret values
        shell: bash
        run: |
          set -euo pipefail
          PROD="https://m3tm-world.vercel.app/api/health?deep=1"
          PREV="https://m3tm-world-git-fix-provider-probe-state-final-20261003-m3-tm.vercel.app/api/health?deep=1"
          curl --fail --silent --show-error --retry 2 --max-time 60 "$PROD" -o /tmp/prod.json
          curl --fail --silent --show-error --retry 2 --max-time 60 "$PREV" -o /tmp/prev.json
          node <<'NODE'
          const fs=require('fs');
          for (const [name,path] of [['production','/tmp/prod.json'],['preview','/tmp/prev.json']]) {
            const h=JSON.parse(fs.readFileSync(path,'utf8'));
            const out={
              deployment_sha:h?.deployment?.sha||null,
              environment:h?.deployment?.environment||null,
              status:h?.status||null,
              gdelt_status:h?.sources?.gdelt?.status||null,
              ais_configured:h?.sources?.ais?.configured===true,
              ais_status:h?.sources?.ais?.status||null,
              cloudflare_configured:h?.sources?.cloudflareRadar?.configured===true,
              cloudflare_status:h?.sources?.cloudflareRadar?.status||null,
              durable_cache_configured:h?.sources?.durableCache?.configured===true,
              durable_cache_status:h?.sources?.durableCache?.status||null,
              opensky_configured:h?.sources?.opensky?.configured===true,
              exact_military_tracks_exposed:h?.observationPolicy?.exactMilitaryTracksExposed,
              exact_military_tracks_persisted:h?.observationPolicy?.exactMilitaryTracksPersisted
            };
            console.log(name+'_health='+JSON.stringify(out));
          }
          NODE
