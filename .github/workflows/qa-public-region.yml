name: Verify regional conflict production after PR152
on:
  pull_request:
    paths:
      - '.github/workflows/qa-public-region.yml'
      - 'tools/qa-public-region.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-region:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only live public API regional assertion
        run: node tools/qa-public-region.mjs
